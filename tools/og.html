<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.card{width:1200px;height:630px;position:relative;overflow:hidden;background:#0b0f1d;color:#f2eee4;font-family:Montserrat,sans-serif;
  background-image:radial-gradient(1.5px 1.5px at 8% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 22% 70%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 35% 15%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 55% 85%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 70% 25%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 88% 60%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 93% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 45% 45%,#fff 50%,transparent 51%),
  radial-gradient(ellipse at 80% 110%,#2a1a0c 0%,transparent 55%),radial-gradient(ellipse at 50% -20%,#1a2140 0%,#0b0f1d 60%)}
h1{position:absolute;left:80px;top:150px;margin:0;font-size:120px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1}
h1 b{color:#f0913f}
p{position:absolute;left:84px;top:300px;margin:0;font-size:34px;font-weight:600;color:#98a0b8;max-width:640px;line-height:1.35}
.row{position:absolute;left:84px;top:440px;display:flex;gap:10px}
.row i{width:54px;height:54px;border-radius:10px;display:block}
.tag{position:absolute;left:84px;top:530px;font-size:22px;font-weight:600;color:#98a0b8}
.planet{position:absolute;right:120px;top:160px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffb46b,#f0913f 55%,#a5551a);box-shadow:0 0 80px rgba(240,145,63,.35)}
.ring{position:absolute;right:20px;top:270px;width:500px;height:100px;border:10px solid rgba(242,238,228,.85);border-radius:50%;transform:rotate(-20deg)}
</style></head><body>
<div class="card">
  <div class="ring"></div><div class="planet"></div>
  <h1>Outer<b>dle</b></h1>
  <p>Um desafio por dia, baseado em Outer Wilds. Adivinhe o local, o personagem ou o registro do diário.</p>
  <div class="row"><i style="background:#3fa060"></i><i style="background:#7d3a3a"></i><i style="background:#e0982e"></i><i style="background:#3fa060"></i><i style="background:#3fa060"></i><i style="background:#7d3a3a"></i></div>
  <div class="tag">Só um fã de verdade acerta de primeira.</div>
</div>
</body></html>
