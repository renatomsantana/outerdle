<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Fonte da imagem de prévia (og.jpg). Abra pelo servidor local e capture a região 1200×630. */
body{margin:0;background:#000}
.card{width:1200px;height:630px;position:relative;overflow:hidden;font-family:Montserrat,sans-serif;color:#f2eee4;
  background:#05070f url(../assets/library_hero.jpg) center right/cover no-repeat}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,15,.92) 0%,rgba(5,7,15,.75) 45%,rgba(5,7,15,.15) 100%)}
.logo{position:absolute;left:70px;top:70px;width:560px}
.dle{position:absolute;left:640px;top:200px;font-size:96px;font-weight:800;color:#f0913f;letter-spacing:.04em;text-shadow:0 4px 24px rgba(0,0,0,.6)}
p{position:absolute;left:84px;top:390px;margin:0;font-size:32px;font-weight:600;color:#e6e1d3;max-width:620px;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.row{position:absolute;left:84px;top:500px;display:flex;gap:10px}
.row i{width:46px;height:46px;border-radius:9px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.tag{position:absolute;left:84px;top:570px;font-size:20px;font-weight:600;color:#98a0b8}
</style></head><body>
<div class="card">
  <img class="logo" src="../assets/logo.png" alt="Outer Wilds">
  <div class="dle">DLE</div>
  <p>Um desafio por dia. Adivinhe o local, o personagem ou o registro do diário de bordo.</p>
  <div class="row"><i style="background:#3fa060"></i><i style="background:#7d3a3a"></i><i style="background:#e0982e"></i><i style="background:#3fa060"></i><i style="background:#3fa060"></i><i style="background:#7d3a3a"></i></div>
  <div class="tag">Só um fã de verdade acerta de primeira.</div>
</div>
</body></html>
