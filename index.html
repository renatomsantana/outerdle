<body>
<div class="wrap">

  <header class="top">
    <div class="logo">
      <h1><img src="assets/logo.png" alt="Outer Wilds" width="562" height="328" decoding="async"><b>dle</b></h1>
    </div>
    <div class="icons">
      <button class="icon" id="btn-archive" title="Arquivo de dias anteriores" aria-label="Arquivo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <button class="icon" id="btn-stats" title="Estatísticas" aria-label="Estatísticas"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
      <button class="icon" id="btn-help" title="Como jogar" aria-label="Como jogar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></svg></button>
      <button class="icon" id="btn-settings" title="Configurações" aria-label="Configurações"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg></button>
    </div>
  </header>

  <nav class="modes" id="modes" role="tablist" aria-label="Modos de jogo"></nav>

  <section class="box game" id="game">
    <div class="game-head">
      <div>
        <h2 id="title">Adivinhe o local de hoje</h2>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="seg-wrap">
        <div class="seg" role="group" aria-label="Tipo de desafio">
          <button id="seg-daily" class="on">Hoje #<span id="daynum">1</span></button>
          <button id="seg-free">Livre</button>
        </div>
        <div class="clock" id="clock" title="Novo desafio à meia-noite">próximo em <b class="cd">--:--:--</b></div>
      </div>
    </div>

    <div class="search">
      <input id="guess" placeholder="Nome do local..." autocomplete="off" spellcheck="false" aria-label="Seu chute" aria-autocomplete="list">
      <button id="go">Enviar</button>
      <div class="list" id="list" role="listbox"></div>
    </div>

    <div class="free-bar hidden" id="freebar">
      <button class="btn small ghost" id="btn-new">Novo alvo</button>
      <button class="btn small ghost" id="btn-giveup">Revelar</button>
    </div>

    <div class="free-bar hidden" id="archivebar">
      <button class="btn small ghost" id="btn-today">Voltar pra hoje</button>
    </div>

    <div id="board" aria-live="polite"></div>
  </section>

  <section class="box result hidden" id="result" aria-live="polite"></section>

  <footer>
    <p>Feito por fãs, para fãs de Outer Wilds!</p>
    <p><a href="privacidade.html">Política de privacidade</a></p>
  </footer>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="close" aria-label="Fechar">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
